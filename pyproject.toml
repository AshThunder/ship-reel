[project]
name = "ship-reel"
version = "0.2.1"
description = "Hermes Agent plugin: URL + brief -> polished, verified product demo reel"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "playwright>=1.44,<2",
    "Pillow>=10.1,<14",
]

[project.optional-dependencies]
# Optional voice-over (Kokoro TTS). The ~120 MB model downloads on first narrated render.
voice = ["kokoro-onnx>=0.4,<1"]

