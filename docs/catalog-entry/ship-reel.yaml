# Draft entry for the Hermes plugin catalog. Replace sha with the full 40-char commit
# of the tagged release before opening the catalog PR.
name: ship-reel
repo: https://github.com/AshThunder/ship-reel
sha: "0000000000000000000000000000000000000000"
version: "0.2.1"
category: tools
author: Chris Gold
license: MIT
requires_hermes: ">=0.21.5"
description: >-
  Turns a URL and a one-line brief into a finished product demo reel: plans and
  dry-runs a shot list, records it in headless Chromium, edits it with auto-zoom,
  cursor, captions and title cards into 16:9 and 9:16 MP4s, verifies and fixes
  the result, and drafts (never posts) the accompanying post.
provides_tools:
  - plan_reel
  - record_reel
  - edit_reel
  - verify_reel
  - fix_reel
  - list_reels
  - reel_status
  - draft_post
provides_hooks:
  - pre_tool_call
requires_env: []
disclosures:
  network: Opens the user-supplied URL and pages in its shot list in headless Chromium. Public hosts only; loopback, private, link-local/metadata, CGNAT and reserved addresses are refused for every URL and every browser request (route filter plus a local filtering proxy) unless the user sets allow_private_hosts / SHIPREEL_ALLOW_PRIVATE_HOSTS=1. With the optional voice-over extra installed, downloads the Kokoro TTS model once from GitHub (SHA-256 pinned). No telemetry.
  subprocess: Runs ffmpeg/ffprobe and local render worker processes.
  filesystem: Writes only to the plugin data directory (or SHIP_REEL_HOME), including the optional voice model.
  bundled_assets: Inter font (OFL) and a procedurally generated music bed (MIT); no binaries.
  browser_actions: Clicks on sign-up, login, payment, send, submit, delete and wallet controls trigger a pre_tool_call approve prompt for the user; the model cannot approve them. Typing into password fields is refused.
  publishing: None. draft_post returns text only.
